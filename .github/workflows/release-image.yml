name: Release image

# 打 v* 标签时构建并推送到 GHCR。手动触发用于补发。
# 镜像地址与 deploy/helm 的 values-production.yaml 一致：
#   ghcr.io/${{ github.repository_owner }}/kaiwu-gateway-service
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 配合 packages: write 即可推 GHCR，不需要额外配置 secret。
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaiwu-gateway-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 境外 runner 直连 Maven Central，不走仓库内的阿里云镜像配置。
          build-args: |
            MAVEN_ARGS=
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 生产集群（R730 K3S）是 amd64；只出这一个架构，构建快且够用。
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
